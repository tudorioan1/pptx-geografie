<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prezentare PowerPoint - Carpații Meridionali</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Redă prezentarea direct prin motorul PowerPoint Online -->
  <iframe id="pptViewer" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>

  <script>
    // Obține automat URL-ul unde este găzduit fișierul presentation.pptx
    const currentFolderUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
    const pptxUrl = currentFolderUrl + 'presentation.pptx';

    // Construiește legătura către viewer-ul oficial Microsoft Office
    const officeEmbedUrl = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(pptxUrl);

    document.getElementById('pptViewer').src = officeEmbedUrl;
  </script>

</body>
</html>
